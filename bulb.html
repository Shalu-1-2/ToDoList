<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulb On/Off Project</title>
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      margin-top: 50px;
    }
    #bulb {
      width: 150px;
      height: 200px;
      margin-bottom: 20px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background-color: red;
      color: white;
      transition:  0.3s ease;
    }
  </style>
</head>
<body>
  <h1>Bulb On/Off Project</h1>
  <img id="bulb" src="offbulb.png" alt="Bulb">
  <br>
  <button id="bulbBtn" onclick="Bulb()">Switch Bulb</button>

  <script>
    let bulbState = 0; 

    function Bulb() {
      const bulb = document.getElementById("bulb");
      const btn = document.getElementById("bulbBtn");

      if (bulbState === 0) {
        bulb.src = "onbulb.jpg";
        btn.textContent = "Turn Bulb Off";
        btn.style.backgroundColor = "green"; 
        bulbState = 1;
      } else {
        bulb.src = "offbulb.png";
        btn.textContent = "Turn Bulb On";
        btn.style.backgroundColor = "red"; 
        bulbState = 0;
      }
    }
  </script>
</body>
</html>
